name: Bug Report
description: Something is broken
labels: ["type: bug", "status: needs-triage"]

body:
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings → SendStack
        2. Configure SMTP provider
        3. Click "Send Test Email"
        4. See error …
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "e.g. 6.5.3"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.2.10"
    validations:
      required: true

  - type: input
    id: sendstack-version
    attributes:
      label: SendStack version
      placeholder: "e.g. 1.0.2"
    validations:
      required: true

  - type: dropdown
    id: active-provider
    attributes:
      label: Active provider
      options:
        - SMTP
        - Gmail
        - SendGrid
        - Mailgun
        - Not configured
    validations:
      required: true

  - type: textarea
    id: other-plugins
    attributes:
      label: Other active plugins
      description: List any plugins that might be relevant (conflict suspects, mail plugins, caching plugins, etc.)
      placeholder: |
        - WooCommerce 8.x
        - WP Super Cache 1.x
    validations:
      required: false

  - type: textarea
    id: error-log
    attributes:
      label: Error log snippet
      description: Paste any relevant PHP errors or SendStack log entries. This will be rendered as a code block.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help us reproduce or understand the bug.
    validations:
      required: false